/* =========================================================
   ANIMATED WALLPAPER
========================================================= */

body::before,
body::after{
  content:"";
  position:fixed;
  width:260px;
  height:260px;
  border-radius:50%;
  filter:blur(70px);
  opacity:.35;
  z-index:-1;
  pointer-events:none;
}

body::before{
  background:#6366f1;
  top:10%;
  left:-100px;
  animation:floatOne 9s ease-in-out infinite alternate;
}

body::after{
  background:#a855f7;
  right:-100px;
  bottom:5%;
  animation:floatTwo 11s ease-in-out infinite alternate;
}

@keyframes floatOne{
  from{
    transform:translate(0,0) scale(1);
  }
  to{
    transform:translate(100px,80px) scale(1.25);
  }
}

@keyframes floatTwo{
  from{
    transform:translate(0,0) scale(1);
  }
  to{
    transform:translate(-90px,-100px) scale(1.3);
  }
}

/* =========================================================

/* =========================================================
   ESCAPE
========================================================= */

function esc(s){

  return String(s || "")
    .replace(/[&<>"]/g,c=>({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;"

    }[c]));

}


/* =========================================================
   IMAGE COMPRESS
========================================================= */

function shrink(file,max=900){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload=()=>{

      const img =
        new Image();

      img.onload=()=>{

        const scale =
          Math.min(
            1,
            max /
            Math.max(
              img.width,
              img.height
            )
          );

        const canvas =
          document.createElement("canvas");

        canvas.width =
          img.width * scale;

        canvas.height =
          img.height * scale;

        canvas
          .getContext("2d")
          .drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            .65
          )
        );

      };

      img.onerror=reject;

      img.src=reader.result;

    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}


/* =========================================================
   FILE PICKER
========================================================= */

function pick(){

  return new Promise(resolve=>{

    const input =
      document.createElement("input");

    input.type="file";

    input.accept="image/*";

    input.onchange=()=>
      resolve(input.files[0]);

    input.click();

  });

}

/* =========================================================

        <button
          onclick="addQuery()"

        </button>

      </div>

    `;

  }


  /* =======================================================
     SEARCH
  ======================================================= */

  html+=`

    <div class="search-wrap">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="search"
        class="search"
        placeholder="Search queries..."

    <div class="section-title">

      <b>
        ${
          isOwner

      <span

    </div>

  `;

     FIRESTORE QUERY
  ======================================================= */

    ? db.collection("queries")

        );

/* =========================================================
   RENDER QUERIES
========================================================= */

function renderQueries(){

  const list =
    document.getElementById("list");

  if(!list) return;


  const search =
    (
      document.getElementById(
        "search"
      )?.value || ""
    )
    .toLowerCase()
    .trim();


  const filtered =
    currentQueries.filter(q=>{

      const text =
        `${q.text||""}
         ${q.name||""}
         ${q.email||""}
         ${STATUS[q.status]||""}`
        .toLowerCase();

      return text.includes(search);

    });


  const count =
    document.getElementById(
      "queryCount"
    );

  if(count){

    count.textContent =
      `${filtered.length} ${
        filtered.length===1
        ? "query"
        : "queries"
      }`;

  }


  if(!filtered.length){

    list.innerHTML=`

      <div class="card empty">

        ${
          search
          ? "🔎 No matching queries found."
          : "📭 No queries yet."
        }

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered.map(q=>`

      <div
        class="card query-card"
        onclick="openQ('${q.id}')"
      >

        <div class="query-top">

          <span class="status">

            ${
              q.status==="done"
              ? "✅"
              : q.status==="review"
              ? "⏳"
              : q.status==="replied"
              ? "💳"
              : "📝"
            }

            ${esc(
              STATUS[q.status] ||
              q.status
            )}

          </span>

          <span
            style="
              color:#475569;
              font-size:11px
            "
          >
            ›
          </span>

        </div>


        <div class="query-text">

          ${esc(q.text)}

        </div>


        ${
          isOwner
          ?

          `<div class="query-user">

            👤
            ${esc(
              q.name ||
              q.email ||
              "User"
            )}

          </div>`

          :

          ""

        }

      </div>

    `).join("");

}

   SEARCH
========================================================= */

/* =========================================================
   OWNER ADD QUERY
========================================================= */

async function ownerAddQuery(){

  const input =
    document.getElementById(
      "ownerQuery"
    );

  const text =
    input.value.trim();


  if(!text){

    alert(
      "Please write a query first."
    );

  await db.collection(
    "queries"
  ).add({

    uid:user.uid,

    name:"Owner",

    email:user.email,

    text:text,

    status:"new",

    created:
      firebase.firestore
      .FieldValue
      .serverTimestamp()

  });


  input.value="";

}


/* =========================================================
   USER ADD QUERY
========================================================= */

async function addQuery(){

  const input =
    document.getElementById(
      "qt"
    );

  const text =
    input.value.trim();


  if(!text) return;


  await db.collection(
    "queries"
  ).add({

    uid:user.uid,

    name:
      user.displayName || "",

    email:
      user.email,

    text:text,

    status:"new",

    created:
      firebase.firestore
      .FieldValue
      .serverTimestamp()

  });


  input.value="";

}


/* =========================================================
   LOAD QR
========================================================= */

async function loadMyQr(){

  const box =
    document.getElementById(
      "myqr"
    );

  if(!box) return;


  const doc =
    await db.doc(
      "settings/owner"
    ).get();


  if(
    !doc.exists ||
    !doc.data().qr ||
    !doc.data().qrExpiresAt
  ){

    box.innerHTML=`

      <div
        style="
          color:#64748b;
          font-size:13px;
          padding:12px
        "
      >
        📷 No QR uploaded
      </div>

    `;

    return;

  }


  const data =
    doc.data();


  const expires =
    data.qrExpiresAt.toMillis();


  if(
    Date.now() >= expires
  ){

    await removeExpiredQr();

    return;

  }


  box.innerHTML=`

    <img
      class="qr"
      src="${esc(data.qr)}"
    >

    <div class="timer-label">
      QR expires in
    </div>

  `;


  startQrTimer(expires);

}


/* =========================================================
   UPLOAD QR
========================================================= */

async function setQr(){

  const file =
    await pick();


  if(!file) return;


  const qr =
    await shrink(
      file,
      700
    );


  const expiresAt =
    firebase.firestore
    .Timestamp
    .fromMillis(
      Date.now()+120000
    );


  await db.doc(
    "settings/owner"
  ).set({

    qr:qr,

    qrExpiresAt:
      expiresAt

  });


  loadMyQr();

}


/* =========================================================
   QR TIMER
========================================================= */

function startQrTimer(expires){

  clearInterval(
    timerInterval
  );


  const update=async()=>{

    const remaining =
      Math.max(
        0,
        expires-Date.now()
      );


    const seconds =
      Math.ceil(
        remaining/1000
      );


    const timer =
      document.getElementById(
        "timerBox"
      );


    if(!timer) return;


    if(seconds<=0){

      clearInterval(
        timerInterval
      );

      timer.innerHTML="";

      await removeExpiredQr();

      return;

    }


    const minutes =
      Math.floor(
        seconds/60
      );


    const sec =
      seconds%60;


    timer.innerHTML=`

      <div class="timer">

        ${minutes}:${String(
          sec
        ).padStart(2,"0")}

      </div>

    `;

  };


  update();


  timerInterval =
    setInterval(
      update,
      1000
    );

}


/* =========================================================
   DELETE EXPIRED QR
========================================================= */

async function removeExpiredQr(){

  clearInterval(
    timerInterval
  );


  try{

    await db
      .doc("settings/owner")
      .update({

        qr:
          firebase.firestore
          .FieldValue
          .delete(),

        qrExpiresAt:
          firebase.firestore
          .FieldValue
          .delete()

      });

  }catch(error){

    console.log(error);

  }


  const qr =
    document.getElementById(
      "myqr"
    );

  const timer =
    document.getElementById(
      "timerBox"
    );


  if(qr){

    qr.innerHTML=`

      <div
        style="
          color:#64748b;
          font-size:13px;
          padding:12px
        "
      >
        ⏱️ QR expired
      </div>

    `;

  }


  if(timer){

    timer.innerHTML="";

  }

}


/* =========================================================
   OPEN QUERY
========================================================= */

function openQ(id){

  if(unsub){

    unsub();

    unsub=null;

  }


  app.innerHTML=`

    <button
      class="gray back"
      onclick="home()"
    >
      ← Back
    </button>

    <div id="queryPage">
      Loading...
    </div>

  `;


  unsub =
    db.doc(
      "queries/"+id
    ).onSnapshot(
      async snapshot=>{

        const d =
          snapshot.data();


        if(!d) return;


        let qr="";


        if(
          d.status==="replied" ||
          d.status==="review" ||
          d.status==="done"
        ){

          const qrDoc =
            await db.doc(
              "settings/owner"
            ).get();


          if(qrDoc.exists){

            const data =
              qrDoc.data();


            if(
              data.qr &&
              data.qrExpiresAt &&
              data.qrExpiresAt.toMillis()
                > Date.now()
            ){

              qr=data.qr;

            }

          }

        }


        document.getElementById(
          "queryPage"
        ).innerHTML=`

          <div class="card">

            <span class="status">

              ${
                d.status==="done"
                ? "✅"
                : d.status==="review"
                ? "⏳"
                : d.status==="replied"
                ? "💳"
                : "📝"
              }

              ${esc(
                STATUS[d.status]
              )}

            </span>


            <div class="query-text">

              ${esc(d.text)}

            </div>


            ${
              isOwner

              ?

              `<div
                class="query-user"
              >
                👤
                ${esc(
                  d.name
                )}
                ·
                ${esc(
                  d.email
                )}
              </div>`

              :

              ""

            }

          </div>


          ${
            d.reply

            ?

            `

            <div class="card">

              <div class="section-title">

                <b>
                  💬 Owner Reply
                </b>

              </div>

              <div
                class="query-text"
              >
                ${esc(d.reply)}
              </div>


              ${
                d.link

                ?

                `<a
                  href="${esc(d.link)}"
                  target="_blank"
                  style="
                    color:#a5b4fc;
                    text-decoration:none;
                    font-size:13px
                  "
                >
                  🎥 Open Recording / Link
                </a>`

                :

                ""

              }


              ${
                d.amount

                ?

                `<div
                  style="
                    margin-top:12px;
                    color:#86efac;
                    font-weight:800
                  "
                >
                  💰 Amount:
                  ₹${esc(
                    String(d.amount)
                  )}
                </div>`

                :

                ""

              }

            </div>

            `

            :

            ""

          }


          ${
            isOwner

            ?

            ownerPanel(
              d,
              id
            )

            :

            userPanel(
              d,
              id,
              qr
            )

          }

        `;

      }
    );

}


/* =========================================================
   OWNER QUERY PANEL
========================================================= */

  if(

    d.status==="replied"
  ){

    return`

      <div class="card">

        <div class="section-title">

          <b>
            ✏️ Reply & Payment
          </b>

        </div>

        <textarea
          id="rp"
          rows="3"
          placeholder="Write reply..."
        >${esc(
          d.reply || ""
        )}</textarea>


        <input
          id="lk"
          placeholder="Recording / QR link"
          value="${esc(
            d.link || ""
          )}"
        >


        <input
          id="am"
          type="number"
          placeholder="Amount ₹"
          value="${esc(
            String(
              d.amount || ""
            )
          )}"
        >


        <button
          onclick="
            sendReply('${id}')
          "
        >
          💳 Send Payment Request
        </button>

    `;

  if(

  ){

    return`

      <div class="card">

        <div class="section-title">

          <b>
            🧾 Payment Screenshot
          </b>

        </div>


        ${
          d.shot

          ?

          `<img
            class="qr"

          >`

          class="green"
          onclick="
            confirmPay('${id}')

    `;

  }


  return`

    <div class="success">

      ✅ Payment confirmed.

      <br>

      Everything will be fixed
      within 5 days.

    </div>

  `;

}


/* =========================================================
   USER PANEL
========================================================= */

function userPanel(
  d,
  id,
  qr
){

  if(
    d.status==="new"
  ){

    return`

      <div class="card">

        <div
          style="
            text-align:center;
            padding:15px;
            color:#94a3b8
          "
        >
          ⏳ Waiting for owner reply...
        </div>

      </div>

    `;

  }


  if(
    d.status==="replied"
  ){

    return`

      <div class="card qr-box">

        <div class="section-title">

          <b>
            💳 Make Payment
          </b>

        </div>


        ${
          qr

          ?

          `

          <img
            class="qr"
            src="${esc(qr)}"
          >

          `

          :

          `

          <div
            style="
              padding:15px;
              color:#64748b
            "
          >
            QR is currently unavailable.
          </div>

          `

        }


        <p
          style="
            color:#94a3b8;
            font-size:12px;
          "
        >
          After payment, upload
          your payment screenshot.
        </p>


        <button
          class="green"
          onclick="
            paid('${id}')
          "
        >
          📸 Upload Payment Screenshot
        </button>

      </div>

    `;

  }


  if(
    d.status==="review"
  ){

    return`

      <div class="card">

        <div
          style="
            text-align:center;
            padding:15px;
            color:#fbbf24
          "
        >
          ⏳ Screenshot received.
          <br>
          Waiting for confirmation...
        </div>

      </div>

    `;

  }


  return`

    <div class="success">

      🎉 <b>Payment Confirmed!</b>

      <br><br>

      Everything will be fixed
      within 5 days.

    </div>

  `;

}


/* =========================================================
   SEND REPLY
========================================================= */

async function sendReply(id){

  const reply =
    document.getElementById(
      "rp"
    ).value.trim();

  const link =
    document.getElementById(
      "lk"
    ).value.trim();

  const amount =
    document.getElementById(
      "am"
    ).value;


  await db
    .doc(
      "queries/"+id
    )
    .update({

      reply:reply,

      link:link,

      amount:amount,

      status:"replied"

    });

}


/* =========================================================
   PAYMENT SCREENSHOT
========================================================= */

async function paid(id){

  const file =
    await pick();


  if(!file) return;


  const image =
    await shrink(
      file
    );


  await db
    .doc(
      "queries/"+id
    )
    .update({

      shot:image,

      status:"review"

    });

}


/* =========================================================
   CONFIRM PAYMENT
========================================================= */

async function confirmPay(id){

  await db
    .doc(
      "queries/"+id
    )
    .update({

      status:"done"

    });

}
